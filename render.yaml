services:
  - type: web
    name: chatbot-app
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: bash -lc "python manage.py migrate --noinput && gunicorn chatbot_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: chatbot_project.settings
      - key: DEBUG
        value: False
